{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Competencias</title>
    <link rel="stylesheet" href="{% static 'css/registro.css' %}">
</head>
<body>

<div class="card">
    <h2>1. Registrar Aprendiz y Competencias</h2>

    {% if error %}
        <div class="alert">{{ error }}</div>
    {% endif %}

    <form method="POST" id="Registro">
        {% csrf_token %}
        <div class="formulario">
            <label for="nombre">Nombre completo:</label>
            <input type="text" id="nombre" name="nombre" required placeholder="Ej: Katherine">
        </div>

        <div class="formulario">
            <label for="email">Correo electrónico:</label>
            <input type="email" id="email" name="email" required placeholder="ejemplo@correo.com">
        </div>

        <div class="formulario">
            <label>Selecciona las Competencias: <br><small>(Selecciona entre 3 y 5 opciones)</small></label>
            
            <div class="competencias-grupo">
                <label class="competencia">
                    <input type="checkbox" name="competencias" value="Lógica de programación y desarrollo">
                    💻 Lógica de programación y desarrollo
                </label>
                <label class="competencia">
                    <input type="checkbox" name="competencias" value="Trabajo en equipo y colaboración">
                    👥 Trabajo en equipo y colaboración
                </label>
                <label class="competencia">
                    <input type="checkbox" name="competencias" value="Comunicación asertiva">
                    🗣️ Comunicación asertiva
                </label>
                <label class="competencia">
                    <input type="checkbox" name="competencias" value="Resolución de problemas técnicos">
                    🔍 Resolución de problemas técnicos
                </label>
                <label class="competencia">
                    <input type="checkbox" name="competencias" value="Orientación al cliente y servicio">
                    🎯 Orientación al cliente y servicio
                </label>
            </div>
        </div>

        <button type="submit" class="guardar_registro">Guardar Registro</button>
    </form>
</div>

<script>
    // Ajustado con tu ID 'Registro'
    document.getElementById('Registro').addEventListener('submit', function(e) {
        const seleccionados = document.querySelectorAll('input[name="competencias"]:checked').length;
        if (seleccionados < 3 || seleccionados > 5) {
            e.preventDefault();
            alert('Por favor selecciona entre 3 y 5 competencias.');
        }
    });
</script>

</body>
</html>
